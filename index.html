<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Teclado Código</title>

<style>
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: transparent;
}

/* CONTENEDOR DE LA IMAGEN */
.contenedor {
  position: relative;
  width: 800px; /* tamaño fijo base */
  max-width: 90vw;
}

/* Imagen */
.contenedor img {
  width: 100%;
  display: block;
}

/* Pantalla */
.pantalla {
  position: absolute;
  top: 18%;
  left: 50%;
  transform: translateX(-50%);
  width: 30%;
  height: 10%;
  color: white;
  font-size: 7vw;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Botones invisibles */
.boton {
  position: absolute;
  width: 10%;
  height: 12%;
  background: transparent;
  border: none;
  cursor: pointer;
}

/* POSICIONES (ahora RELATIVAS a la imagen) */
#b1 { top: 38%; left: 20%; }
#b2 { top: 35%; left: 33%; }
#b3 { top: 35%; left: 58%; }

#b4 { top: 50%; left: 20%; }
#b5 { top: 48%; left: 33%; }
#b6 { top: 48%; left: 51%; }

#b7 { top: 65%; left: 20%; }
#b8 { top: 65%; left: 43%; }
#b9 { top: 65%; left: 51%; }

/* Mensaje */
.mensaje {
  position: absolute;
  bottom: 15%;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 24px;
}
</style>

</head>
<body>

<div class="contenedor">
  <img src="teclado.jpg">

  <div class="pantalla" id="pantalla"></div>

  <!-- Botones -->
  <button id="b1" class="boton" onclick="agregar(1)"></button>
  <button id="b2" class="boton" onclick="agregar(2)"></button>
  <button id="b3" class="boton" onclick="agregar(3)"></button>

  <button id="b4" class="boton" onclick="agregar(4)"></button>
  <button id="b5" class="boton" onclick="agregar(5)"></button>
  <button id="b6" class="boton" onclick="agregar(6)"></button>

  <button id="b7" class="boton" onclick="agregar(7)"></button>
  <button id="b8" class="boton" onclick="agregar(8)"></button>
  <button id="b9" class="boton" onclick="agregar(9)"></button>

  <div class="mensaje" id="mensaje"></div>
</div>

<script>
let codigo = "";
const correcto = "2479";

function agregar(numero) {
  if (codigo.length < 4) {
    codigo += numero;
    document.getElementById("pantalla").innerText = codigo;
  }

  if (codigo.length === 4) {
    comprobar();
  }
}

function comprobar() {
  if (codigo === correcto) {
    document.getElementById("mensaje").innerText = "✅ Correcto";
  } else {
    document.getElementById("mensaje").innerText = "❌ Incorrecto";
  }

  setTimeout(() => {
    codigo = "";
    document.getElementById("pantalla").innerText = "";
    document.getElementById("mensaje").innerText = "";
  }, 30000);
}
</script>

</body>
</html>
