<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Teclado Código</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: url("teclado.jpg") no-repeat center;
  background-size: contain;
  height: 100vh;
  position: relative;
  color: white;
}

/* Pantalla */
.pantalla {
  position: absolute;
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  width: 400px;
  height: 100px;
  background: transparent;
  color: rgb(255, 255, 255);
  font-size: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
}

/* Botones invisibles */
.boton {
  position: absolute;
  width: 80px;
  height: 60px;
  background: transparent;
  border: none;
  cursor: pointer;
}

/* POSICIONES (ajústalas si hace falta) */
#b1 { top: 38%; left: 30%; }
#b2 { top: 45%; left: 42%; }
#b3 { top: 38%; left: 60%; }

#b4 { top: 50%; left: 30%; }
#b5 { top: 50%; left: 42%; }
#b6 { top: 50%; left: 60%; }

#b7 { top: 65%; left: 30%; }
#b8 { top: 62%; left: 45%; }
#b9 { top: 65%; left: 51%; }

/* Mensaje */
.mensaje {
  position: absolute;
  top: 80%;
  width: 100%;
  text-align: center;
  font-size: 24px;
}
</style>

</head>
<body>

<div class="pantalla" id="pantalla"></div>

<!-- Botones invisibles -->
<button id="b1" class="boton" onclick="agregar(1)"></button>
<button id="b2" class="boton" onclick="agregar(2)"></button>
<button id="b3" class="boton" onclick="agregar(3)"></button>

<button id="b4" class="boton" onclick="agregar(4)"></button>
<button id="b5" class="boton" onclick="agregar(5)"></button>
<button id="b6" class="boton" onclick="agregar(6)"></button>

<button id="b7" class="boton" onclick="agregar(7)"></button>
<button id="b8" class="boton" onclick="agregar(8)"></button>
<button id="b9" class="boton" onclick="agregar(9)"></button>

<div class="mensaje" id="mensaje"></div>

<script>
let codigo = "";
const correcto = "2479";

function agregar(numero) {
  if (codigo.length < 4) {
    codigo += numero;
    document.getElementById("pantalla").innerText = codigo;
  }

  if (codigo.length === 4) {
    comprobar();
  }
}

function comprobar() {
  if (codigo === correcto) {
    document.getElementById("mensaje").innerText = "✅ Correcto";
  } else {
    document.getElementById("mensaje").innerText = "❌ Incorrecto";
  }

  setTimeout(() => {
    codigo = "";
    document.getElementById("pantalla").innerText = "";
    document.getElementById("mensaje").innerText = "";
  }, 50000);
}
</script>

</body>
</html>
